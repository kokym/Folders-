<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOKYM ARCHIVE | แผงควบคุมแอดมิน</title>
    <style>
        /* --- ธีมหลัก ดำ-แดง-ทอง คุมโทนระบบทั้งหมด --- */
        body {
            background-color: #0d0d0d;
            color: #d1c4a9;
            font-family: 'Segoe UI', Sarabun, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        header {
            border-bottom: 2px solid #8b0000;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #d4af37;
            margin: 0;
            font-size: 1.8rem;
        }

        .btn-back {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-back:hover { color: #d4af37; }

        /* --- สไตล์ของฟอร์มกรอกข้อมูล --- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #161616;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.4);
        }

        .btn-submit {
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #b22222; }

        /* --- กล่องแสดงผลลัพธ์โค้ดที่สร้างขึ้นมา --- */
        .result-box {
            margin-top: 40px;
            background: #111;
            border: 1px solid #d4af37;
            padding: 20px;
            border-radius: 6px;
            display: none; /* ซ่อนไว้ก่อน พอกดปุ่มค่อยโผล่ */
        }

        .result-box h3 {
            color: #d4af37;
            margin-top: 0;
        }

        textarea.code-output {
            width: 100%;
            height: 250px;
            background: #000;
            color: #00ff00; /* ฟีลแบบ Hacker/Developer */
            font-family: monospace;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #222;
            font-size: 0.85rem;
        }

        .btn-copy {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚙️ ระบบเขียนบทความ (Admin Panel)</h1>
            <a href="articles.html" class="btn-back">← กลับหน้าบทความ</a>
        </header>

        <div class="form-group">
            <label for="artTitle">หัวข้อบทความ:</label>
            <input type="text" id="artTitle" placeholder="เช่น วิเคราะห์พงศาวลี เล่าเปียน ย้อนเวลาสูู่สามก๊ก">
        </div>

        <div class="form-group">
            <label for="artImg">ลิงก์รูปภาพธัมเนล (URL รูปภาพ):</label>
            <input type="text" id="artImg" placeholder="วางลิงก์รูปภาพของคุณที่นี่">
        </div>

        <div class="form-group">
            <label for="artContent">เนื้อหาบทความทั้งหมด:</label>
            <textarea id="artContent" rows="10" placeholder="พิมพ์หรือวางเนื้อหาบทความแบบจัดเต็มที่นี่..."></textarea>
        </div>

        <button class="btn-submit" onclick="generateArticleCode()">⚔️ สร้างโค้ดหน้าบทความสำเร็จรูป</button>

        <div class="result-box" id="resultBox">
            <h3>✨ สร้างโค้ดสำเร็จ!</h3>
            <p style="font-size: 0.85rem; color: #888;">ก๊อปปี้โค้ดสีเขียวด้านล่างนี้ ไปสร้างไฟล์ใหม่บน GitHub (เช่น ชื่อ <code>my-new-article.html</code>) ได้เลยครับ</p>
            <textarea class="code-output" id="codeOutput" readonly></textarea>
            <button class="btn-copy" onclick="copyCode()">📋 ก๊อปปี้โค้ดทั้งหมด</button>
        </div>
    </div>

    <script>
        function generateArticleCode() {
            var title = document.getElementById("artTitle").value;
            var img = document.getElementById("artImg").value || "https://images.unsplash.com/photo-1599408162172-ef090f707f1d?q=80&w=600&auto=format&fit=crop";
            var content = document.getElementById("artContent").value;
            var date = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

            if (!title || !content) {
                alert("กรุณากรอกหัวข้อและเนื้อหาบทความก่อนครับ!");
                return;
            }

            // โครงสร้างหน้าเพจอ่านบทความแบบสำเร็จรูป
            var generatedHTML = `<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>\${title}</title>
    <style>
        body { background-color: #0d0d0d; color: #d1c4a9; font-family: 'Segoe UI', Sarabun, sans-serif; margin:0; padding:0; line-height: 1.8; }
        .nav { background: #111; padding: 15px; border-bottom: 1px solid #222; }
        .nav a { color: #d4af37; text-decoration: none; font-size: 0.9rem; }
        .article-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #d4af37; line-height: 1.4; margin-bottom: 10px; }
        .meta { color: #555; font-size: 0.85rem; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .main-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 30px; border: 1px solid #222; }
        .content { white-space: pre-line; color: #b5a991; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="nav"><div style="max-width:700px; margin:0 auto;"><a href="articles.html">← กลับไปหน้าบทความทั้งหมด</a></div></div>
    <div class="article-container">
        <h1>\${title}</h1>
        <div class="meta">📅 อัปเดตเมื่อ: \${date} | เขียนโดย: Admin</div>
        <img class="main-img" src="\${img}" alt="Thumbnail">
        <div class="content">\${content}</div>
    </div>
</body>
</html>`;

            document.getElementById("codeOutput").value = generatedHTML;
            document.getElementById("resultBox").style.display = "block";
            
            // เลื่อนจอลงมาให้เห็นกล่องผลลัพธ์
            document.getElementById("resultBox").scrollIntoView({ behavior: 'smooth' });
        }

        function copyCode() {
            var copyText = document.getElementById("codeOutput");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // สำหรับมือถือ
            navigator.clipboard.writeText(copyText.value);
            alert("ก๊อปปี้โค้ดสำเร็จแล้ว!");
        }
    </script>

</body>
</html>
