<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บทความ — Shadow Phase 影变</title>
<script>(function(){var k='sp-theme',s=localStorage.getItem(k);if(!s)s=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',s);})();</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sp-app.css">
<style>
/* reading progress */
.progress { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--crimson); width: 0; z-index: 100; transition: width .1s linear; }

.art-head { padding: clamp(48px,6vw,80px) 0 clamp(28px,3vw,40px); }
.art-head .back { display: inline-flex; align-items: center; gap: .5em; color: var(--ink-faint); font-size: .88rem; margin-bottom: 32px; transition: color .2s var(--ease); }
.art-head .back:hover { color: var(--crimson); }
.art-head .cat-tag { display:block; margin-bottom: 18px; }
.art-head h1 { font-size: clamp(2.1rem,4.4vw,3.4rem); margin: 0 0 18px; font-weight: 500; max-width: 22ch; text-wrap: balance; line-height: 1.16; }
.art-head .cn-title { font-family: var(--font-cn); font-size: clamp(1.6rem,3vw,2.2rem); color: var(--crimson); letter-spacing: .3em; margin-bottom: 26px; }
.art-meta { display: flex; align-items: center; gap: 14px; color: var(--ink-faint); font-size: .9rem; flex-wrap: wrap; }
.art-meta .dot { width:3px;height:3px;border-radius:50%;background:var(--ink-faint); }

.art-divider { height: 1px; background: var(--rule); margin: 0; }

/* reading body */
.reader { max-width: var(--read); margin: 0 auto; padding: clamp(40px,5vw,60px) 0 0; }
.reader p { font-size: 1.18rem; line-height: 1.95; color: var(--ink); margin: 0 0 1.5em; letter-spacing: .003em; }
.reader p em { font-style: normal; font-weight: 600; color: var(--crimson); }
.reader > p:first-of-type::first-letter {
  font-family: var(--font-display); font-weight: 600; float: left; font-size: 4.2rem;
  line-height: .82; padding: 6px 14px 0 0; color: var(--crimson);
}
.reader h2 {
  font-family: var(--font-head); font-size: clamp(1.5rem,2.6vw,2rem); font-weight: 500;
  margin: 2em 0 .7em; padding-top: .3em; position: relative; line-height: 1.3;
}
.reader h2::before { content:''; position:absolute; top:0; left:0; width:38px; height:2px; background: var(--crimson); }
.reader blockquote {
  margin: 2.2em 0; padding: 0 0 0 30px; border-left: 2px solid var(--crimson);
  font-family: var(--font-head); font-style: italic; font-size: clamp(1.4rem,2.6vw,1.75rem);
  line-height: 1.5; color: var(--ink); font-weight: 400;
}
.reader blockquote .src { display:block; font-family: var(--font-body); font-style: normal; font-size: .92rem; color: var(--ink-faint); margin-top: 14px; letter-spacing: .01em; }

/* end seal signature */
.art-end { max-width: var(--read); margin: 60px auto 0; padding-top: 40px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
.art-end img { width: 84px; height: 84px; }
.art-end .cn { font-family: var(--font-cn); color: var(--ink-faint); letter-spacing: .3em; font-size: .95rem; }

/* related */
.related { padding-top: 80px; }
.rel-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 18px; }
@media (max-width:640px){ .rel-grid { grid-template-columns: 1fr; } }
.rel-card { border: 1px solid var(--rule); padding: 26px; cursor: pointer; background: var(--paper-card); transition: border-color .25s var(--ease), transform .25s var(--ease); display:flex; flex-direction:column; gap:10px; }
.rel-card:hover { border-color: var(--crimson); transform: translateY(-3px); }
.rel-card h3 { font-size: 1.25rem; margin: 0; font-weight: 500; }
.rel-card .excerpt { font-size: .95rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<script src="theme.js"></script>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Shadow Phase หน้าแรก">
      <img class="seal seal-img" src="assets/seal-sp.png" alt="ตราประทับ S.P.">
      <span class="lock"><span class="name">SHADOW PHASE</span><span class="sub">影变</span></span>
    </a>
    <nav class="nav">
      <a href="index.html">หน้าแรก</a>
      <a href="Articles.html">บทความ</a>
      <a href="Articles.html#cats">หมวดหมู่</a>
      <a href="index.html#about">เกี่ยวกับ</a>
    </nav>
    <button class="theme-btn" data-theme-toggle aria-label="สลับโหมดสว่าง/มืด">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.2 6.2 0 0 0 9.5 9.5z"/></svg>
    </button>
  </div>
</header>

<main>
  <article>
    <div class="art-head">
      <div class="wrap">
        <a class="back" href="Articles.html">← กลับสู่บทความทั้งหมด</a>
        <span class="cat-tag" id="aCat"></span>
        <h1 id="aTitle"></h1>
        <div class="cn-title" id="aCn"></div>
        <div class="art-meta" id="aMeta"></div>
      </div>
    </div>
    <div class="art-divider"></div>
    <div class="wrap">
      <figure class="art-cover" id="aCover" style="display:none"><img alt=""></figure>
      <div class="reader" id="reader"></div>
      <div class="art-end">
        <img class="seal-img" src="assets/seal-sp.png" alt="ตราประทับ S.P.">
        <span class="cn">影变 · 完</span>
      </div>

      <!-- COMMENTS -->
      <section class="comments" id="comments"></section>
    </div>
  </article>

  <section class="related">
    <div class="wrap">
      <div class="sec-head">
        <div><span class="eyebrow">อ่านต่อ <span class="cn">續讀</span></span></div>
        <a class="link-arrow" href="Articles.html">ทั้งหมด <span class="ar">→</span></a>
      </div>
      <div class="rel-grid" id="related"></div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <img class="seal seal-img" src="assets/seal-sp.png" alt="ตราประทับ S.P.">
        <p>Shadow Phase 影变 — พื้นที่บันทึกความคิดว่าด้วยประวัติศาสตร์ราชวงศ์จีน ปรัชญา และเงาของกาลเวลา</p>
      </div>
      <div class="foot-cols">
        <div class="foot-col">
          <h4>สำรวจ</h4>
          <a href="index.html">หน้าแรก</a>
          <a href="Articles.html">บทความทั้งหมด</a>
        </div>
        <div class="foot-col" id="footCats"></div>
      </div>
    </div>
    <div class="foot-bottom">
      <span>© 2026 Shadow Phase 影变</span>
      <span class="cn">影者，光之所遺也</span>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="sp-store.js"></script>
<script src="sp-auth-ui.js"></script>
<script>
(async function () {
  var cats = window.SP_CATEGORIES;
  await SP.ready;
  var arts = await SP.listArticles();
  var order = ['history','reflection','fiction','review'];
  function fmtDate(s){var d=new Date(s);var m=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}

  var slug = new URLSearchParams(location.search).get('a');
  var a = arts.find(function(x){return x.slug===slug;}) || arts[0];

  document.title = a.title + ' — Shadow Phase 影变';
  document.getElementById('aCat').textContent = cats[a.cat].th;
  document.getElementById('aTitle').textContent = a.title;
  document.getElementById('aCn').textContent = a.cn;
  document.getElementById('aMeta').innerHTML =
    '<span>'+fmtDate(a.date)+'</span><span class="dot"></span>'+
    '<span>อ่าน '+a.read+' นาที</span><span class="dot"></span>'+
    '<span class="cn" style="color:var(--crimson)">S.P. 親筆</span>';

  // cover
  var coverEl = document.getElementById('aCover');
  if (a.cover) { coverEl.style.display = ''; coverEl.querySelector('img').src = a.cover; }

  // body
  var r = document.getElementById('reader');
  r.innerHTML = a.body.map(function(b){
    if(b[0]==='h2') return '<h2>'+b[1]+'</h2>';
    if(b[0]==='quote') return '<blockquote>'+b[1]+(b[2]?'<span class="src">'+b[2]+'</span>':'')+'</blockquote>';
    if(b[0]==='img') return '<figure class="art-fig"><img src="'+String(b[1]).replace(/"/g,'&quot;')+'" alt="'+(b[2]||'').replace(/"/g,'&quot;')+'" loading="lazy">'+(b[2]?'<figcaption>'+b[2]+'</figcaption>':'')+'</figure>';
    return '<p>'+b[1]+'</p>';
  }).join('');

  // related (same cat first, then others)
  var rel = arts.filter(function(x){return x.slug!==a.slug;})
    .sort(function(x,y){ return (y.cat===a.cat) - (x.cat===a.cat) || new Date(y.date)-new Date(x.date); })
    .slice(0,2);
  document.getElementById('related').innerHTML = rel.map(function(x){
    return '<article class="rel-card" data-slug="'+x.slug+'">'+
      '<span class="cat-tag">'+cats[x.cat].th+'</span>'+
      '<h3>'+x.title+'</h3>'+
      '<p class="excerpt">'+x.excerpt+'</p></article>';
  }).join('');
  document.querySelectorAll('.rel-card').forEach(function(c){ c.onclick=function(){location.href='Article.html?a='+c.dataset.slug;}; });

  document.getElementById('footCats').innerHTML = '<h4>หมวดหมู่</h4>'+
    order.map(function(k){return '<a href="Articles.html?cat='+k+'#cats">'+cats[k].th+'</a>';}).join('');

  // ---- comments ----
  var cEl = document.getElementById('comments');
  function cEsc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function cWhen(iso){var d=new Date(iso);return fmtDate(iso)+' · '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

  async function renderComments(){
    var list = await SP.listComments(a.slug), s = SP.session(), admin = SP.isAdmin();
    var html = '<div class="c-head"><h2>ความคิดเห็น</h2><span class="c-count">'+list.length+'</span><span class="cn">评论</span></div>';
    if (s) {
      html += '<div class="c-compose">'+
        '<span class="sp-ava">'+cEsc((s.name||s.email).slice(0,1))+'</span>'+
        '<div class="c-box">'+
          '<textarea class="sp-textarea" id="cInput" placeholder="ร่วมแลกเปลี่ยนความคิดเห็น..."></textarea>'+
          '<div class="c-row"><span class="c-as">แสดงความคิดเห็นในชื่อ <b>'+cEsc(s.name||s.email)+'</b></span>'+
          '<button class="btn btn-primary" id="cSend" type="button">ส่งความคิดเห็น</button></div>'+
        '</div></div>';
    } else {
      html += '<div class="c-locked"><p>เข้าสู่ระบบเป็นสมาชิกเพื่อร่วมแสดงความคิดเห็นใต้บทความนี้</p>'+
        '<button class="btn btn-primary" id="cLogin" type="button">เข้าสู่ระบบ / สมัคร</button></div>';
    }
    if (list.length) {
      html += '<div class="c-list">'+list.map(function(c){
        var isAdmin = c.role==='admin';
        var canDel = admin || (s && c.uid===s.uid);
        var likes = c.likes || [];
        var liked = !!(s && likes.indexOf(s.uid)>-1);
        var cnt = likes.length;
        return '<div class="c-item">'+
          '<span class="sp-ava"'+(isAdmin?' style="background:var(--crimson)"':'')+'>'+cEsc((c.name||'?').slice(0,1))+'</span>'+
          '<div class="c-body"><div class="c-by"><span class="nm">'+cEsc(c.name||'ผู้ใช้')+'</span>'+
            (isAdmin?'<span class="badge">แอดมิน</span>':'')+
            (s && c.uid===s.uid && !isAdmin?'<span class="badge mine">คุณ</span>':'')+
            '<span class="when">'+cWhen(c.date)+'</span>'+
            (canDel?'<button class="c-del" data-id="'+c.id+'" type="button">ลบ</button>':'')+
          '</div><div class="c-text">'+cEsc(c.text).replace(/\n/g,'<br>')+'</div>'+
          '<div class="c-foot"><button class="c-like'+(liked?' liked':'')+'" data-id="'+c.id+'" data-liked="'+(liked?'1':'')+'" type="button" aria-pressed="'+liked+'">'+
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5l-1.3-1.2C6 14.9 3 12.2 3 8.9 3 6.3 5 4.3 7.6 4.3c1.5 0 2.9.7 3.8 1.8.9-1.1 2.3-1.8 3.8-1.8C17.8 4.3 19.8 6.3 19.8 8.9c0 3.3-3 6-6.7 10.4z"/></svg>'+
            '<span class="c-like-n">'+(cnt||'')+'</span></button></div>'+
          '</div></div>';
      }).join('')+'</div>';
    } else {
      html += '<div class="c-empty">ยังไม่มีความคิดเห็น — มาเป็นคนแรกที่ร่วมแลกเปลี่ยน</div>';
    }
    cEl.innerHTML = html;

    var send = document.getElementById('cSend');
    if (send) send.onclick = function(){
      var inp = document.getElementById('cInput');
      send.disabled = true;
      Promise.resolve(SP.addComment(a.slug, inp.value)).then(function(r){
        send.disabled = false;
        if (r.ok) renderComments(); else alert(r.msg);
      });
    };
    var lg = document.getElementById('cLogin');
    if (lg) lg.onclick = function(){ SP.openAuth(); };
    cEl.querySelectorAll('.c-del').forEach(function(b){
      b.onclick = function(){ if(confirm('ลบความคิดเห็นนี้?')){ Promise.resolve(SP.deleteComment(b.dataset.id)).then(renderComments); } };
    });
    cEl.querySelectorAll('.c-like').forEach(function(b){
      b.onclick = function(){
        if(!SP.session()){ SP.openAuth(); return; }
        b.disabled = true;
        Promise.resolve(SP.toggleLike(b.dataset.id, b.dataset.liked==='1')).then(renderComments);
      };
    });
  }
  SP.onAuth(function(){ renderComments(); });
  renderComments();

  // reading progress
  var bar = document.getElementById('progress');
  window.addEventListener('scroll', function(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h>0 ? (window.scrollY/h*100) : 0)+'%';
  }, {passive:true});

  window.scrollTo(0,0);
})();
</script>
</body>
</html>
